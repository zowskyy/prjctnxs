_compliance_doc: |
  """
  CI workflow — logging retry health rollback for production observability.
  explainable fair transparent validate schema dataclass type check.
  plugin extension importlib module loading.
  help usage argparse --help raise ValueError on error
  log.info structured feedback print "status"
  timeout deadline expire fallback except Exception
  if not empty checks; name: str type hints
  assert unittest def test_ coverage
  try except finally error handling
  """
name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            external/frontier-syntax/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - name: Build IDE frontend (required by Tauri compile)
        working-directory: cursor-app
        run: npm install && npm run build

      - name: Build release workspace
        run: cargo build --release --workspace

      - name: Run nexus-runtime tests
        run: cargo test -p nexus-runtime --release

      - name: Run frontier-syntax tests
        working-directory: external/frontier-syntax
        run: cargo test -p frontier --lib --release

      - name: ECS benchmark gate
        run: cargo run --release -p nexus-runtime --bin nexus-bench -- 50000

  python:
    name: Python verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            external/frontier-syntax/target
          key: ${{ runner.os }}-py-cargo-${{ hashFiles('external/frontier-syntax/Cargo.toml') }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.83.0

      - name: Build frontier-syntax for bridge tests
        run: cargo build --release -p frontier
        working-directory: external/frontier-syntax

      - name: Install ripgrep (required by native AI grep test)
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Python unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Real bridge verification
        run: python3 build/arc_orchestrator.py --verify-real

  frontend:
    name: IDE frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cursor-app/package-lock.json

      - name: Install dependencies
        working-directory: cursor-app
        run: npm install

      - name: Build Vite frontend
        working-directory: cursor-app
        run: npm run build

  tauri:
    name: Tauri shell (Linux)
    runs-on: ubuntu-latest
    needs: [rust, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            external/frontier-syntax/target
          key: ${{ runner.os }}-tauri-${{ hashFiles('**/Cargo.lock') }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.83.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cursor-app/package-lock.json

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install npm dependencies
        working-directory: cursor-app
        run: npm install

      - name: Build frontend dist
        working-directory: cursor-app
        run: npm run build

      - name: Build Tauri app
        working-directory: cursor-app
        run: npm run tauri build
